# ^ref: https://goreleaser.com/customization/package/docker_digests/
# Writes dist/digests.txt — one `<hex digest>  <image:tag>` line per published
# image/manifest, sha256sum format — which the release workflow feeds to
# actions/attest so the images get the same GitHub build-provenance
# attestation as every file in checksums.txt. Verify with:
#   gh attestation verify --owner devthenet-labs \
#     oci://ghcr.io/devthenet-labs/patchy/<name>:vX.Y.Z
docker_digest:
    name_template: digests.txt

# ^ref: https://goreleaser.com/customization/sign/docker/
# Keyless cosign signatures over the pushed container images. The empty
# `artifacts` default selects exactly the dockers_v2 image artifacts above, and
# signing targets the immutable digest, not the tag. Signatures are pushed to
# ghcr as OCI artifacts next to each image: cosign v3 stores each signature as
# a sigstore bundle attached via the OCI referrers API, the format the
# platform's kyverno verification reads (type: SigstoreBundle rules).
# --use-signing-config=false only pins the v2 trust services (Fulcio + public
# Rekor v1) — it does not change the storage format, so do not mistake it for
# a legacy-format (.sig tag) pin.
# Runs only on publish; `make snapshot` additionally skips it via --skip=sign.
# Verify with:
#   cosign verify ghcr.io/devthenet-labs/patchy/<name>:vX.Y.Z \
#     --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp='^https://github.com/bitwise-media-group/github-workflows/'
docker_signs:
    - cmd: cosign
      args:
          - sign
          - ${artifact}@${digest}
          - --yes
          - --use-signing-config=false
      output: true

# ^ref: https://goreleaser.com/customization/sign/sign/
# Keyless cosign signatures over each built binary; the reusable release workflow
# supplies the GitHub Actions OIDC token. `make snapshot` skips this (--skip=sign).
binary_signs:
    - cmd: cosign
      signature: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}.sigstore.json"
      args:
          - sign-blob
          - --bundle=${signature}
          - ${artifact}
          - --yes
      output: true

# One SBOM per BINARY, not per archive.
#
# The archive is a tarball of every binary, so an archive-scoped SBOM lists the
# union of all seven dependency trees and cannot answer "does this CVE affect
# source-controller?". A binary-scoped SBOM can: syft reads the module list Go
# embeds at link time, which contains only what that binary actually links.
# The CLI's rendering stack (glamour, chroma, bluemonday) therefore appears in
# patchy's SBOM and in none of the controllers' — the dependency boundary as
# evidence attached to the shipped artifact, rather than as an assertion about
# how the Go linker behaves. Verify by hand with:
#   go version -m bin/source-controller | grep charmbracelet
sboms:
    - artifacts: binary
      # syft is pinned by the toolchain submodule's mise config and on PATH for
      # whoever runs goreleaser (make snapshot locally, the release workflow in CI).
      cmd: syft
      args:
          - $artifact
          - --output
          - spdx-json=$document

snapshot:
    version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
    sort: asc
    use: github
    format: "{{ .SHA }}: {{ .Message }}{{ if and (not .IsNightly) .Logins }} ({{ .Logins | englishJoin }}){{ end }}"
    filters:
        exclude:
            - "^test"
            - "^chore"
            - "^build"
    groups:
        - title: "New Features"
          regexp: '^.*?feat(\(.+\))??!?:.+$'
          order: 100
        - title: "Security Updates"
          regexp: '^.*?sec(\(.+\))??!?:.+$'
          order: 150
        - title: "Bug Fixes"
          regexp: '^.*?(fix|refactor)(\(.+\))??!?:.+$'
          order: 200
        - title: "Documentation Updates"
          regexp: ^.*?docs?(\(.+\))??!?:.+$
          order: 400
        - title: Other Work
          order: 9999

release:
    github:
        owner: devthenet-labs
        name: patchy
    # The release-please job in release.yaml leaves a draft release named after
    # the tag it pushes. Adopt that draft instead of creating a second release,
    # swap its release-please notes for the grouped changelog above, and
    # undraft it only once every asset has been uploaded.
    use_existing_draft: true
    mode: replace
