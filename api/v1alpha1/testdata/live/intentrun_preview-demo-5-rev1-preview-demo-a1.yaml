    `Built:` marker). `gofmt -l`, `go vet`, and `go test` all pass on this code as-is.

    ## What was still missing

    The round-1 review feedback (the `changelog` CI job) failed because `CHANGELOG.md` has no entry
    for `#9`. The plan's own risk section anticipated this and said it would leave the changelog entry
    for the human to add "since the PR number is not known at build time." The review feedback now
    gives us that PR number directly (`PR_NUMBER: 9` in the job log, and the error names `#9`), so I
    added the missing line under `## Unreleased` in `CHANGELOG.md`:

    ```
    - Add a static "Deployed by patchy" footer to the welcome card (#9).
    ```

    This follows the same format as the existing entry for `#8` and satisfies the `changelog` job's
    check (`grep -Eq "#9([^0-9]|$)" CHANGELOG.md`).

    ## What I did not change

    No changes to `main.go`, `server.go`, `server_test.go`, `Dockerfile`, `deploy/example.yaml`,
    `.patchy/`, or `.github/` — the footer code and its test were already correct and complete, and
    the plan's steps for those files required no further action.

