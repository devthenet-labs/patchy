    - `go test -race ./...` could not run: this image has no `gcc`/C compiler and `CGO_ENABLED=0` by
      default, and `-race` requires cgo. This is an image/environment limitation, not a code issue;
      the non-race test run covers the same test cases and all pass.

    ## For reviewers

    - The only change in this round is the one-line `CHANGELOG.md` addition; the footer feature itself
      was already present and untouched.
