#
# One ConfigMap per controller, consumed with envFrom. Every key is a PATCHY_*
# environment variable (internal/cli/options.go maps them back onto flags):
# the shared keys come from .Values.config — each overridable per controller
# by repeating the key under <controller>.config — and the
# controller-specific keys from <controller>.config, so each ConfigMap
# carries exactly the settings its binary binds. The key vocabulary mirrors
# deploy/kustomize/base/configmap.yaml.
#
# NOT here: forge/provider credentials. They live in Secrets referenced by
# the Integration and Forge custom resources (spec.secretRef) — see crs.yaml
# and deploy/kustomize/base/secrets.example.yaml.
#
# The data is assembled as a dict so the extra maps (config.extra, then
# <controller>.config.extra) can override any derived key without rendering
# it twice.
#
# agent.repositoryImages, when enabled, adds the repository-image keys to the
# source-, investigation- and remediation-controller data (and to
# intent-controller's, when that is deployed), plus the cosign public key
# ConfigMap source-controller mounts (last in this file). Its render-time
# guards run here, because this file always renders.
#
# The optional intent-controller renders its ConfigMap from the same define
# below, but from its own template (intent-controller.yaml), so the whole
# component stays behind intentController.enabled.
{{- include "patchy.repositoryImagesGuard" . }}
{{- range $c := list
    (dict "name" "integration-controller" "vals" .Values.integrationController)
    (dict "name" "source-controller" "vals" .Values.sourceController)
    (dict "name" "context-controller" "vals" .Values.contextController)
    (dict "name" "investigation-controller" "vals" .Values.investigationController)
    (dict "name" "remediation-controller" "vals" .Values.remediationController)
}}
{{- include "patchy.controllerConfigMap" (dict "root" $ "c" $c) }}
{{- end }}

{{- /*
One controller's ConfigMap document. Context: dict "root" $ "c" (dict "name"
<controller> "vals" <its values block>). A define rather than inline so
deployments.yaml can hash exactly this controller's ConfigMap into its pod
template's checksum/config annotation: a helm upgrade that changes one
controller's config rolls that controller, and no other.
*/}}
{{- define "patchy.controllerConfigMap" }}
{{- $root := .root }}
{{- $c := .c }}
{{- $g := $root.Values.config }}
{{- $own := $c.vals.config }}
{{/*
The health address is fixed: the containerPort, probes, and NetworkPolicy
ports all say 8081, so a knob here would just let the pieces disagree. Same
for :8080 (integration) and :9790 (source).
*/}}
{{- $data := dict
    "PATCHY_HEALTH_ADDR" ":8081"
    "PATCHY_LOG_LEVEL" ($own.logLevel | default $g.logLevel)
}}
{{- if eq $c.name "integration-controller" }}
{{- $_ := set $data "PATCHY_LISTEN_ADDR" ":8080" }}
{{- $_ := set $data "PATCHY_ACCUMULATION_WINDOW" $own.accumulationWindow }}
{{- $_ := set $data "PATCHY_PROJECTION_CONCURRENCY" $own.projectionConcurrency }}
{{- $intRI := $root.Values.agent.repositoryImages | default dict }}
{{- if $intRI.enabled }}
{{/*
The runner-image tracking-issue comment: integration-controller watches each
finding's Repository record and projects rejections and fallbacks to owners.
*/}}
{{- $_ := set $data "PATCHY_REPOSITORY_IMAGES" "true" }}
{{- end }}
{{- else if eq $c.name "context-controller" }}
{{- $_ := set $data "PATCHY_ENHANCE_CONCURRENCY" $own.enhanceConcurrency }}
{{- $_ := set $data "PATCHY_ENHANCE_MAX_OUTBOUND" $own.enhanceMaxOutbound }}
{{- $_ := set $data "PATCHY_ENHANCER_CONFIG_TTL" $own.enhancerConfigTTL }}
{{- else if eq $c.name "source-controller" }}
{{- $_ := set $data "PATCHY_ARTIFACT_ADDR" ":9790" }}
{{- $_ := set $data "PATCHY_ARTIFACT_DIR" "/data/artifacts" }}
{{/*
The binary's own default base URL assumes the kustomize Service name
(patchy-source-controller); the chart's Service is <fullname>-source-
controller, so the URL minted into Repository statuses is pinned here.
*/}}
{{- $_ := set $data "PATCHY_ARTIFACT_BASE_URL" (printf "http://%s-source-controller.%s.svc.cluster.local:9790" (include "patchy.fullname" $root) $root.Release.Namespace) }}
{{- if $root.Values.evaluationController.enabled }}
{{/*
The internal workspace-blob endpoint the evaluation controller streams
uploads to (NetworkPolicy-gated to that one client). Rendered only when the
evaluation controller is deployed — without it the second listener never
starts.
*/}}
{{- $_ := set $data "PATCHY_ARTIFACT_INTERNAL_ADDR" ":9791" }}
{{- $_ := set $data "PATCHY_WORKSPACE_RETENTION" $root.Values.evaluationController.workspaceRetention }}
{{- end }}
{{- $ri := $root.Values.agent.repositoryImages | default dict }}
{{- if $ri.enabled }}
{{/*
Repository-declared runner images: source-controller reads the declaration
out of the pinned tarball and resolves it under this policy. The cosign key
and the registry credential are files (mounted by deployments.yaml); only
their paths are config.
*/}}
{{- $_ := set $data "PATCHY_REPOSITORY_IMAGES" "true" }}
{{- $_ := set $data "PATCHY_REPOSITORY_IMAGE_REGISTRIES" (join "," $ri.registries) }}
{{- $_ := set $data "PATCHY_REPOSITORY_IMAGE_MAX_BYTES" $ri.maxBytes }}
{{- $_ := set $data "PATCHY_REPOSITORY_IMAGE_ON_REJECT" ($ri.onReject | default "default") }}
{{- $_ := set $data "PATCHY_REPOSITORY_IMAGE_ALLOW_UNSIGNED" ($ri.allowUnsigned | default false) }}
{{- if $ri.cosignPublicKey }}
{{- $_ := set $data "PATCHY_REPOSITORY_IMAGE_COSIGN_KEY_FILE" "/etc/patchy/repository-image/cosign.pub" }}
{{- end }}
{{- if $ri.pullSecret }}
{{- $_ := set $data "DOCKER_CONFIG" "/etc/patchy/registry" }}
{{- end }}
{{- end }}
{{- else if or (eq $c.name "investigation-controller") (eq $c.name "remediation-controller") }}
{{/*
The job-controller block, shared by both: how the agent Jobs run, and the
budgets a remediation may spend. One runner per enabled harness stamps its
own PATCHY_<HARNESS>_AGENT_IMAGE and
credential keys, and PATCHY_HARNESSES restricts the controllers to exactly the
harnesses enabled here (network-policy rendering can't probe credentials, so
enablement is explicit). Pinning a runner's image digest is one edit under
agent.runners.<harness>.image.
*/}}
{{- $_ := set $data "PATCHY_MAX_ATTEMPTS" ($own.maxAttempts | default $g.maxAttempts) }}
{{- $_ := set $data "PATCHY_PRIORITY_AGING_INTERVAL" ($own.priorityAgingInterval | default $g.priorityAgingInterval) }}
{{- $_ := set $data "PATCHY_PRIORITY_AGING_CAP" ($own.priorityAgingCap | default $g.priorityAgingCap) }}
{{- $_ := set $data "PATCHY_AGENT_NAMESPACE" $root.Values.agent.namespace }}
{{- $_ := set $data "PATCHY_AGENT_SERVICE_ACCOUNT" $root.Values.agent.serviceAccount }}
{{- $enabled := list }}
{{- range $id, $r := $root.Values.agent.runners }}
{{- if $r.enabled }}
{{- $enabled = append $enabled $id }}
{{- $_ := set $data (printf "PATCHY_%s_AGENT_IMAGE" (upper $id)) (include "patchy.image" (dict "root" $root "binary" (printf "%s-agent-runner" $id) "image" $r.image)) }}
{{- if eq $id "claude" }}
{{/*
Claude is brokered: the broker URL + provider stamps replace the
PATCHY_CLAUDE_SECRET* keys — no model credential exists in the agent
namespace for claude anymore.
*/}}
{{- $_ := include "patchy.claudeProviderData" (dict "root" $root "data" $data) }}
{{- else if $r.secret }}
{{- $_ := set $data (printf "PATCHY_%s_SECRET" (upper $id)) $r.secret }}
{{- $_ := set $data (printf "PATCHY_%s_SECRET_KEY" (upper $id)) $r.secretKey }}
{{- $_ := set $data (printf "PATCHY_%s_SECRET_ENV" (upper $id)) $r.secretEnv }}
{{- end }}
{{- end }}
{{- end }}
{{- $_ := set $data "PATCHY_HARNESSES" (join "," $enabled) }}
{{- $_ := set $data "PATCHY_JOB_DEADLINE" $root.Values.agent.jobDeadline }}
{{- $_ := set $data "PATCHY_JOB_TTL" $root.Values.agent.jobTTL }}
{{- $_ := set $data "PATCHY_MODEL_ALLOWLIST" $root.Values.agent.modelAllowlist }}
{{- $_ := set $data "PATCHY_REMEDIATE_AUTO_MAX_TURNS" $root.Values.agent.remediate.auto.maxTurns }}
{{- $_ := set $data "PATCHY_REMEDIATE_AUTO_TOKEN_BUDGET" $root.Values.agent.remediate.auto.tokenBudget }}
{{- $_ := set $data "PATCHY_REMEDIATE_MANUAL_MAX_TURNS" $root.Values.agent.remediate.manual.maxTurns }}
{{- $_ := set $data "PATCHY_REMEDIATE_MANUAL_TOKEN_BUDGET" $root.Values.agent.remediate.manual.tokenBudget }}
{{- if eq $c.name "investigation-controller" }}
{{- $_ := set $data "PATCHY_FINDING_MIN_AGE" $own.findingMinAge }}
{{- $_ := set $data "PATCHY_GATE_CONCURRENCY" $own.gateConcurrency }}
{{- $_ := set $data "PATCHY_MAX_CONCURRENT_INVESTIGATIONS" $own.maxConcurrentInvestigations }}
{{- $_ := set $data "PATCHY_CONFIDENCE_THRESHOLD" $own.confidenceThreshold }}
{{- $_ := set $data "PATCHY_INVESTIGATE_MODEL" $root.Values.agent.investigate.model }}
{{- $_ := set $data "PATCHY_INVESTIGATE_TIMEOUT" $root.Values.agent.investigate.timeout }}
{{- $_ := set $data "PATCHY_INVESTIGATE_MAX_TURNS" $root.Values.agent.investigate.maxTurns }}
{{- $_ := set $data "PATCHY_INVESTIGATE_TOKEN_BUDGET" $root.Values.agent.investigate.tokenBudget }}
{{- else }}
{{- $_ := set $data "PATCHY_MAX_CONCURRENT_REMEDIATIONS" $own.maxConcurrentRemediations }}
{{- $_ := set $data "PATCHY_FINDING_TTL" $own.findingTTL }}
{{- $_ := set $data "PATCHY_REMEDIATE_MODEL" $root.Values.agent.remediate.model }}
{{- $_ := set $data "PATCHY_REMEDIATE_TIMEOUT" $root.Values.agent.remediate.timeout }}
{{- end }}
{{- $ri := $root.Values.agent.repositoryImages | default dict }}
{{- if $ri.enabled }}
{{/*
Both job controllers run a Repository's pinned image only while this is on,
and put the ephemeral-storage wall on every agent Job; the changeset entry
cap is remediation's alone.
*/}}
{{- $_ := set $data "PATCHY_REPOSITORY_IMAGES" "true" }}
{{- $_ := set $data "PATCHY_AGENT_EPHEMERAL_STORAGE" $ri.ephemeralStorage }}
{{- if eq $c.name "remediation-controller" }}
{{- $_ := set $data "PATCHY_CHANGESET_MAX_ENTRIES" $ri.changesetMaxEntries }}
{{- end }}
{{- end }}
{{- else if eq $c.name "intent-controller" }}
{{/*
intent-controller runs its agent Jobs on brokered claude and nothing else
(no other harness honours the plan stage's read-only sandbox), so only the
claude runner is stamped, whatever agent.runners enables for findings. Its
own settings carry an intent- prefix (PATCHY_INTENT_*), and its Job deadline
is its own: a build stage alone may take an hour.
*/}}
{{- $_ := set $data "PATCHY_AGENT_NAMESPACE" $root.Values.agent.namespace }}
{{- $_ := set $data "PATCHY_AGENT_SERVICE_ACCOUNT" $root.Values.agent.serviceAccount }}
{{- $_ := set $data "PATCHY_JOB_TTL" $root.Values.agent.jobTTL }}
{{- $_ := set $data "PATCHY_CLAUDE_AGENT_IMAGE" (include "patchy.image" (dict "root" $root "binary" "claude-agent-runner" "image" $root.Values.agent.runners.claude.image)) }}
{{- $_ := include "patchy.claudeProviderData" (dict "root" $root "data" $data) }}
{{- $_ := set $data "PATCHY_HARNESSES" "claude" }}
{{- $_ := set $data "PATCHY_INTENT_POLL_INTERVAL" $own.pollInterval }}
{{- $_ := set $data "PATCHY_INTENT_APPROVAL_POLL_INTERVAL" $own.approvalPollInterval }}
{{- $_ := set $data "PATCHY_INTENT_PR_POLL_INTERVAL" $own.prPollInterval }}
{{- $_ := set $data "PATCHY_INTENT_MAX_CONCURRENT_RUNS" $own.maxConcurrentRuns }}
{{- $_ := set $data "PATCHY_INTENT_RATE_LIMIT_FLOOR" $own.rateLimitFloor }}
{{- $_ := set $data "PATCHY_INTENT_TTL" $own.intentTTL }}
{{- $_ := set $data "PATCHY_INTENT_JOB_DEADLINE" $own.jobDeadline }}
{{- range $stage := list "plan" "build" }}
{{- $s := index $own $stage }}
{{- $prefix := printf "PATCHY_INTENT_%s_" (upper $stage) }}
{{- $_ := set $data (print $prefix "MODEL") $s.model }}
{{- $_ := set $data (print $prefix "MAX_TURNS") $s.maxTurns }}
{{- $_ := set $data (print $prefix "TOKEN_BUDGET") $s.tokenBudget }}
{{- $_ := set $data (print $prefix "TIMEOUT") $s.timeout }}
{{- end }}
{{- $_ := set $data "PATCHY_INTENT_REVISE_MAX_TURNS" $own.revise.maxTurns }}
{{- $_ := set $data "PATCHY_INTENT_REVISE_TOKEN_BUDGET" $own.revise.tokenBudget }}
{{- $_ := set $data "PATCHY_INTENT_REVISE_TIMEOUT" $own.revise.timeout }}
{{- $ri := $root.Values.agent.repositoryImages | default dict }}
{{- if $ri.enabled }}
{{/*
A build runs only on an accepted repository image (a Project may opt out
with requireRepositoryImage: false), so without these keys every build
blocks on ImageRequired. The changeset entry cap is remediation's value.
*/}}
{{- $_ := set $data "PATCHY_REPOSITORY_IMAGES" "true" }}
{{- $_ := set $data "PATCHY_AGENT_EPHEMERAL_STORAGE" $ri.ephemeralStorage }}
{{- $_ := set $data "PATCHY_CHANGESET_MAX_ENTRIES" $ri.changesetMaxEntries }}
{{- end }}
{{- end }}
{{/*
The global egress proxy (spec.proxy on a Forge/GitHub Integration overrides
it per resource). NO_PROXY always starts with the cluster-internal suffixes
so in-cluster traffic (the artifact endpoint, the egress broker, the API
server) never detours through the proxy. Set before the extra loops so
config.extra keeps the last word.
*/}}
{{- $p := $root.Values.proxy | default dict }}
{{- if or $p.httpsProxy $p.httpProxy }}
{{- with $p.httpsProxy }}
{{- $_ := set $data "HTTPS_PROXY" . }}
{{- end }}
{{- with $p.httpProxy }}
{{- $_ := set $data "HTTP_PROXY" . }}
{{- end }}
{{- $no := "localhost,127.0.0.1,.svc,.cluster.local" }}
{{- with $p.noProxy }}
{{- $no = printf "%s,%s" $no . }}
{{- end }}
{{- $_ := set $data "NO_PROXY" $no }}
{{- end }}
{{- range $k, $v := $g.extra }}
{{- $_ := set $data $k $v }}
{{- end }}
{{- range $k, $v := $own.extra }}
{{- $_ := set $data $k $v }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "patchy.configMapName" (dict "root" $root "name" $c.name) }}
    namespace: {{ $root.Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" $root "name" $c.name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $root) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
data:
    {{- range $k, $v := $data }}
    {{- /* Helm parses every values.yaml number as a float64, and toString
           renders a large one in scientific notation ("1.2e+06"), which the
           binaries' strconv.Atoi rejects at startup. Integral floats are
           therefore rendered as integers; genuine fractions (confidence
           thresholds) fall through unchanged. */ -}}
    {{- $s := $v | toString }}
    {{- if and (kindIs "float64" $v) (eq $v (floor $v)) }}
    {{- $s = int64 $v | toString }}
    {{- end }}
    {{ $k }}: {{ $s | quote }}
    {{- end }}
{{- end }}
{{- $ri := .Values.agent.repositoryImages | default dict }}
{{- if and $ri.enabled $ri.cosignPublicKey }}
---
# The public key every repository-declared image must be cosign-signed with,
# mounted into source-controller at /etc/patchy/repository-image/cosign.pub
# (PATCHY_REPOSITORY_IMAGE_COSIGN_KEY_FILE). A public key, so a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "patchy.fullname" . }}-repository-image-key
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "source-controller") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
data:
    cosign.pub: |
        {{- $ri.cosignPublicKey | trim | nindent 8 }}
{{- end }}
