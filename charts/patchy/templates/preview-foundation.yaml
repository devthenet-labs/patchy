#
# Empty preview slots and their non-optional guardrails. Every resource in this
# file is kept on uninstall/rollback. Removing a namespace while it has a
# workload would delete that workload; keeping only the namespace would leave
# it unguarded. The operator must drain the slot and clean up explicitly.
{{- if .Values.preview.enabled }}
{{- $p := .Values.preview }}
{{- if or (lt (int $p.slotCount) 1) (gt (int $p.slotCount) 4) }}{{ fail "preview.slotCount must be between 1 and 4" }}{{ end }}
{{- if not $p.imageRegistry }}{{ fail "preview.imageRegistry is required when preview.enabled=true" }}{{ end }}
{{- $dnsCIDR := $p.dnsCIDR | default .Values.clusterDNSCIDR }}
{{- if not $dnsCIDR }}{{ fail "preview.dnsCIDR is required when preview.enabled=true: the node-local cluster DNS /32 (it defaults to clusterDNSCIDR when that is set)" }}{{ end }}
{{- if not $p.albSubnetCIDRs }}{{ fail "preview.albSubnetCIDRs is required when preview.enabled=true" }}{{ end }}
{{- if and $p.albSubnetIDs (ne (len $p.albSubnetIDs) (len $p.albSubnetCIDRs)) }}{{ fail "preview.albSubnetIDs must name one subnet per preview.albSubnetCIDRs entry: the ALB's subnets are the only sources the slots admit" }}{{ end }}
{{- /* Preview sign-in (previewAuth). Only once it is REQUIRED may the
       allowlist go (Rev C): an empty inboundCIDRs with prefix lists still
       restricts sources; with neither, any address reaches the preview ALB,
       which needs the explicit allowPublicWithAuth confirmation and a short
       ALB session (a cookie replayed from anywhere stays valid until it
       expires). Never inferred from the cluster. */}}
{{- $pas := include "patchy.previewAuthState" . | fromJson }}
{{- $authRequired := and $pas.enabled (eq $pas.stage "require") }}
{{- /* Once sign-in has been required, its kept policy refuses any slot
       Ingress without the pinned set, the placeholder included: a render
       that no longer requires it would fail part-way through the upgrade.
       Stopping is the rollback runbook's, and a lookup sees whether it ran
       (helm template sees nothing, as ever). */}}
{{- if and (not $authRequired) (lookup "admissionregistration.k8s.io/v1" "ValidatingAdmissionPolicyBinding" "" "patchy-preview-all-slots-ingress-auth") }}
{{- fail "preview sign-in is required on this cluster (the kept binding patchy-preview-all-slots-ingress-auth is live), but this render does not require it, so the placeholder and every preview Ingress would be refused. To stop requiring sign-in, first scale the preview-controller to zero and delete that binding, and only while preview.inboundCIDRs is set" }}
{{- end }}
{{- if not $p.inboundCIDRs }}
{{- if not $authRequired }}{{ fail "preview.inboundCIDRs is required when preview.enabled=true, unless preview sign-in is required (previewAuth.enabled with previewAuth.stage=require)" }}{{ end }}
{{- if not $p.prefixListsIDs }}
{{- if ne ($p.allowPublicWithAuth | default "") "confirmed" }}{{ fail "preview.inboundCIDRs and preview.prefixListsIDs are both empty, which opens the preview ALB to any address: set preview.allowPublicWithAuth=confirmed to accept that sign-in alone guards previews, and only after the ALB probe has run" }}{{ end }}
{{- if gt (int .Values.previewAuth.sessionTimeout) 900 }}{{ fail (printf "preview.allowPublicWithAuth needs previewAuth.sessionTimeout of at most 900 (it is %d): until the ALB probe shows how its session cookie behaves, the session is the window a replayed cookie works in" (int .Values.previewAuth.sessionTimeout)) }}{{ end }}
{{- /* The ceiling the policies admit is sessionTimeout, except for the one
       upgrade off a chart that pinned the timeout exactly, which keeps the
       old value applied. Never open the ALB with that longer session. */}}
{{- if gt (int $pas.timeoutCeiling) 900 }}{{ fail (printf "preview.allowPublicWithAuth needs a session of at most 900 seconds, but the live slot admission policy pins auth-session-timeout %d exactly (a chart before the timeout ceiling), so this upgrade would keep applying it: upgrade once with previewAuth.sessionTimeout=%d and the allowlist still set, then remove the allowlist" (int $pas.timeoutCeiling) (int .Values.previewAuth.sessionTimeout)) }}{{ end }}
{{- end }}
{{- end }}
{{- if not $p.certificateARN }}{{ fail "preview.certificateARN is required when preview.enabled=true" }}{{ end }}
{{- if not $p.hostSuffix }}{{ fail "preview.hostSuffix is required when preview.enabled=true" }}{{ end }}
{{- if not $p.albName }}{{ fail "preview.albName is required when preview.enabled=true" }}{{ end }}
{{- $slots := list }}
{{- range $i := until (int $p.slotCount) }}{{ $slots = append $slots (printf "patchy-preview-%d" $i) }}{{ end }}
{{- range $slot := $slots }}
---
apiVersion: v1
kind: Namespace
metadata:
    name: {{ $slot }}
    annotations:
        helm.sh/resource-policy: keep
    labels:
        kubernetes.io/metadata.name: {{ $slot }}
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
        app.kubernetes.io/part-of: patchy-preview
        {{- if $.Values.previewController.config.targetHealth }}
        # EKS Auto Mode's load balancer injects a target-health readiness
        # gate into the slot's Pods (the upstream AWS Load Balancer
        # Controller's label is elbv2.k8s.aws/pod-readiness-gate-inject; the
        # alb-preview class is Auto Mode's), so a Pod is Ready, and the
        # Preview with it, only once its target is healthy. Only with
        # previewController.config.targetHealth, whose Ingress ordering (the
        # binding before the Pods, kept across redeploys) the gate needs;
        # without it the slots run exactly as slice 2 ran them, ungated.
        eks.amazonaws.com/pod-readiness-gate-inject: enabled
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: preview-isolation
    namespace: {{ $slot }}
    annotations:
        helm.sh/resource-policy: keep
spec:
    podSelector: {}
    policyTypes: [Ingress, Egress]
    ingress:
        - from:
            {{- range $cidr := $p.albSubnetCIDRs }}
            - ipBlock:
                  cidr: {{ $cidr }}
            {{- end }}
          ports:
            - protocol: TCP
              port: http
    egress:
        - to:
            - ipBlock:
                  cidr: {{ $dnsCIDR }}
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
---
apiVersion: v1
kind: ResourceQuota
metadata:
    name: preview-quota
    namespace: {{ $slot }}
    annotations:
        helm.sh/resource-policy: keep
spec:
    # Sized for one Preview of up to four components: a Service each plus
    # slot 0's placeholder, and room for every component's rolling update
    # to start its new Pod (maxSurge 1) beside the one still serving.
    hard:
        pods: "8"
        requests.cpu: "1"
        requests.memory: 1Gi
        limits.cpu: "2"
        limits.memory: 2Gi
        services: "5"
        services.loadbalancers: "0"
        services.nodeports: "0"
        count/ingresses.networking.k8s.io: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
    name: preview-limits
    namespace: {{ $slot }}
    annotations:
        helm.sh/resource-policy: keep
spec:
    limits:
        - type: Container
          defaultRequest:
              cpu: 25m
              memory: 32Mi
          default:
              cpu: 250m
              memory: 256Mi
          max:
              cpu: "1"
              memory: 512Mi
{{- end }}
---
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
    name: alb-preview
    annotations:
        helm.sh/resource-policy: keep
spec:
    scheme: internet-facing
    {{- with $p.albSubnetIDs }}
    # Exactly the subnets whose CIDRs preview-isolation admits. Unpinned,
    # Auto Mode places the ALB in a kubernetes.io/role/elb subnet of every
    # zone it finds one in, and albSubnetCIDRs must then cover all of them.
    subnets:
        ids:
            {{- range $id := . }}
            - {{ $id }}
            {{- end }}
    {{- end }}
    loadBalancerName: {{ $p.albName }}
    group:
        name: {{ $p.albName }}
    targetType: ip
    sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
    certificateARNs:
        - {{ $p.certificateARN }}
    listeners:
        - port: 443
          protocol: HTTPS
    {{- with $p.inboundCIDRs }}
    inboundCIDRs:
        {{- range $cidr := . }}
        - {{ $cidr }}
        {{- end }}
    {{- end }}
    {{- with $p.prefixListsIDs }}
    # Managed prefix lists admitted beside inboundCIDRs (a VPN's or an
    # office's egress ranges kept in one place). Optional; inboundCIDRs stays
    # required.
    prefixListsIDs:
        {{- range $id := . }}
        - {{ $id }}
        {{- end }}
    {{- end }}
    namespaceSelector:
        matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
                {{- range $slot := $slots }}
                - {{ $slot }}
                {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
    name: alb-preview
    annotations:
        helm.sh/resource-policy: keep
        ingressclass.kubernetes.io/is-default-class: "false"
spec:
    controller: eks.amazonaws.com/alb
    parameters:
        apiGroup: eks.amazonaws.com
        kind: IngressClassParams
        name: alb-preview
{{- if $p.placeholder.enabled }}
---
# Keep an empty target group so the separate preview ALB and its DNS name do
# not churn between Preview CRs. This Service has no selector or endpoints;
# it never schedules a Pod or exposes a patchy controller.
apiVersion: v1
kind: Service
metadata:
    name: patchy-preview-placeholder
    namespace: patchy-preview-0
    annotations:
        helm.sh/resource-policy: keep
spec:
    type: ClusterIP
    ports:
        - name: http
          port: 80
          targetPort: 80
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: patchy-preview-placeholder
    namespace: patchy-preview-0
    annotations:
        helm.sh/resource-policy: keep
        {{- if $authRequired }}
        # Slot 0's pinned sign-in set, so the placeholder host is authenticated
        # too (the relay answers it 404: no Preview is ever named placeholder).
        {{- range $k, $v := get $pas.sets (toString (int $pas.applyGen)) | dig "patchy-preview-0" dict }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        {{- end }}
spec:
    ingressClassName: alb-preview
    rules:
        - host: placeholder.{{ $p.hostSuffix }}
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: patchy-preview-placeholder
                            port:
                                number: 80
{{- end }}
{{- end }}
