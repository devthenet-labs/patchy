---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: findings.patchy.bitwisemedia.uk
spec:
  group: patchy.bitwisemedia.uk
  names:
    categories:
    - patchy
    kind: Finding
    listKind: FindingList
    plural: findings
    shortNames:
    - fnd
    singular: finding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repository.name
      name: Repo
      type: string
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .status.priority
      name: Priority
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.investigation.recommendation
      name: Verdict
      type: string
    - jsonPath: .status.tracking.url
      name: Issue
      priority: 1
      type: string
    - jsonPath: .status.pullRequest.url
      name: PR
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Finding is the authoritative state machine for one security finding. The
          tracking item (e.g. a GitHub issue) is a one-way human-facing projection of
          this resource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FindingSpec is the finding to triage. integration-controller writes it at
              ingest and during accumulation; humans may set suspend and add related-to
              edges. The one other writer is context-controller, which sets repository
              exactly once when a cloud finding arrived without one — see that field.
            properties:
              advisories:
                description: |-
                  Advisories identify the vulnerability, most authoritative first
                  (GHSA > CVE > CWE); [0] is the accumulation key.
                items:
                  type: string
                minItems: 1
                type: array
              alerts:
                description: Alerts folded into this finding during accumulation.
                items:
                  description: |-
                    Alert is one scanner alert folded into the finding during accumulation.
                    IDs are strings — GHAS alert numbers render as decimal, other scanners use
                    opaque identifiers.
                  properties:
                    id:
                      description: ID of the alert in the source system.
                      minLength: 1
                      type: string
                    locations:
                      description: Locations the alert points at.
                      items:
                        description: Location is one source location an alert points
                          at.
                        properties:
                          endLine:
                            description: EndLine of the flagged region.
                            format: int32
                            type: integer
                          path:
                            description: Path of the file, repo-relative.
                            type: string
                          snippet:
                            description: Snippet is the flagged source excerpt.
                            maxLength: 1024
                            type: string
                          startLine:
                            description: StartLine of the flagged region (1-based).
                            format: int32
                            type: integer
                        required:
                        - path
                        type: object
                      maxItems: 8
                      type: array
                    source:
                      description: |-
                        Source is the source handler that produced this alert, denormalized
                        from the finding at ingest. Accumulation keys on source, so today every
                        alert on a finding shares spec.source and this is redundant — but
                        duplicate-of merges are defined to fold one finding into another, and
                        the verdict write-back must hand each source only its own alerts.
                        Recording provenance beats inferring it from the shape of an id.
                        Empty on alerts written before this field existed; readers fall back to
                        spec.source.
                      type: string
                    url:
                      description: URL of the alert in the source system.
                      type: string
                  required:
                  - id
                  type: object
                maxItems: 64
                type: array
              approval:
                description: |-
                  Approval is the recorded human approval: written by the status page or
                  the CLI, or by integration-controller once an approve command on the
                  tracking issue is authorised (status.commands).
                properties:
                  at:
                    description: At is when the approval was received.
                    format: date-time
                    type: string
                  by:
                    description: By is the approving login.
                    type: string
                  note:
                    description: Note is optional free text following the approve
                      command.
                    maxLength: 1024
                    type: string
                required:
                - at
                - by
                type: object
              cloudResource:
                description: |-
                  CloudResource identifies the cloud resource this finding was raised
                  against, for findings about infrastructure rather than repository code.
                  Written at ingest and never again; it is what an enhancer resolves
                  repository from.
                properties:
                  displayName:
                    description: DisplayName is the resource's human-facing name.
                    type: string
                  location:
                    description: Location is the region or zone, when the provider
                      reports one.
                    type: string
                  name:
                    description: |-
                      Name is the provider's canonical, unique resource identifier — an SCC
                      resourceName, e.g. "//storage.googleapis.com/projects/p/buckets/b". It
                      is the accumulation scope for cloud findings, in place of the
                      repository URL.
                    minLength: 1
                    type: string
                  project:
                    description: Project is the enclosing project, subscription, or
                      account id.
                    type: string
                  provider:
                    description: Provider is the cloud platform the resource lives
                      on.
                    enum:
                    - google
                    - aws
                    - azure
                    type: string
                  type:
                    description: Type is the provider's resource type, e.g. "google.cloud.storage.Bucket".
                    type: string
                required:
                - name
                - provider
                type: object
              description:
                description: Description is the scanner's full description, truncated
                  at ingest.
                maxLength: 65536
                type: string
              expedite:
                description: |-
                  Expedite marks the finding urgent for its whole lifetime
                  (human-written): the investigation gate skips the accumulation window
                  and minimum age, and both schedulers rank the finding's runs ahead of
                  all non-expedited work.
                properties:
                  at:
                    description: At is when the request was received.
                    format: date-time
                    type: string
                  by:
                    description: By is the requesting login.
                    type: string
                required:
                - at
                - by
                type: object
              integrationRef:
                description: IntegrationRef names the Integration that ingested this
                  finding.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              overflowAlerts:
                description: |-
                  OverflowAlerts counts alerts dropped past the cap (total observed =
                  len(alerts) + overflowAlerts).
                format: int32
                type: integer
              related:
                description: Related is the finding's relationship edges.
                items:
                  description: |-
                    RelatedFinding is a directed edge between two findings, stored identically
                    on both endpoints (one of from/to is the holder's own name). Names may
                    dangle after the other endpoint's TTL deletion — consumers tolerate that.
                  properties:
                    from:
                      description: From is the edge's source Finding name.
                      type: string
                    relationship:
                      description: Relationship classifies the edge.
                      enum:
                      - duplicate-of
                      - successor-of
                      - related-to
                      type: string
                    to:
                      description: To is the edge's target Finding name.
                      type: string
                  required:
                  - from
                  - relationship
                  - to
                  type: object
                maxItems: 32
                type: array
              repository:
                description: |-
                  Repository the finding belongs to; nil when none has been identified.
                  integration-controller sets it at ingest for sources that name a
                  repository. For a cloud finding it starts nil and context-controller
                  may set it — SET-ONCE, never overwritten. Three things depend on that:
                  the rollup ledger re-derives its scope key at reversal time, the
                  investigation gate's Repository artifact has an immutable spec.url with
                  no update path, and the agent Jobs snapshot the repo in an annotation.
                  A mutable value would desynchronize all three silently.
                properties:
                  defaultBranch:
                    description: DefaultBranch of the repository at ingest time.
                    type: string
                  name:
                    description: Name is the human form ("owner/repo"), for display.
                    type: string
                  type:
                    description: Type of forge the repository lives on.
                    enum:
                    - github
                    type: string
                  url:
                    description: URL is the normalized https URL of the repository.
                    minLength: 1
                    type: string
                required:
                - type
                - url
                type: object
              retry:
                description: |-
                  Retry requests recovery of a Failed finding back to the state it
                  failed from (human-written). Actionable while newer than
                  status.completedAt; the phase-owning controller consumes it by
                  performing the transition.
                properties:
                  at:
                    description: At is when the request was received.
                    format: date-time
                    type: string
                  by:
                    description: By is the requesting login.
                    type: string
                required:
                - at
                - by
                type: object
              ruleID:
                description: RuleID is the scanner rule that fired.
                type: string
              severity:
                description: Severity assigned by the scanner.
                enum:
                - low
                - medium
                - high
                - critical
                type: string
              source:
                description: Source is the source handler ID (e.g. github-code-scanning).
                minLength: 1
                type: string
              suspend:
                description: Suspend pauses pipeline progress for this finding (human-written).
                type: boolean
              title:
                description: Title is the human summary line.
                type: string
              trackingRef:
                description: |-
                  TrackingRef names the Integration that projects this finding to its
                  tracking system, denormalized at creation (stable if the ingesting
                  integration later retargets).
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - advisories
            - integrationRef
            - source
            type: object
          status:
            description: |-
              FindingStatus is the finding's observed state. Field writers are noted per
              field; every field has exactly one writer component.
            properties:
              accumulateUntil:
                description: AccumulateUntil closes the accumulation window (integration).
                format: date-time
                type: string
              activeRun:
                description: |-
                  ActiveRun points at the child currently running (respective
                  controllers).
                properties:
                  kind:
                    description: Kind of the active run.
                    enum:
                    - investigation
                    - remediation
                    type: string
                  name:
                    description: Name of the active child.
                    type: string
                required:
                - kind
                - name
                type: object
              attempts:
                description: Attempts tallies agent runs (respective controllers).
                properties:
                  investigation:
                    description: Investigation attempts so far.
                    format: int32
                    type: integer
                  remediation:
                    description: Remediation attempts so far.
                    format: int32
                    type: integer
                type: object
              commands:
                description: |-
                  Commands are the human commands made on the tracking issue, kept from
                  the delivery that carried them until they are answered
                  (integration). A webhook delivery is answered before it is handled
                  and never redelivered after that, so the delivery only records a
                  command here; the projection then authorises it against GitHub,
                  applies it and replies, retrying while GitHub fails.
                properties:
                  consumed:
                    description: |-
                      Consumed are the comment ids of the latest commands answered after
                      their author's write access was confirmed, the largest
                      MaxConsumedCommands of them, in ascending order. A delivery of one of
                      them (a duplicate, or a demo replay) records nothing. A refused
                      command's id is not kept, so commenting cannot push a maintainer's
                      command out of the list; a refused command delivered again is only
                      refused again. An id that has left the list is recorded and answered
                      again if it is delivered again: a suspend or resume older than
                      LastToggle as superseded, anything else as the finding's phase then
                      admits.
                    items:
                      format: int64
                      type: integer
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                  lastToggle:
                    description: |-
                      LastToggle is the comment id of the latest suspend or resume decided
                      Done. One written before it that arrives later is answered
                      Superseded rather than applied, so the finding stays as the last one
                      written left it, however late an older delivery arrives; and a
                      delivery of LastToggle itself records nothing.
                    format: int64
                    minimum: 0
                    type: integer
                  pending:
                    description: |-
                      Pending are the commands recorded and not yet answered, at most
                      MaxPendingCommandsPerActor of them from any one account. Their
                      decisions and effects are taken in comment-id order: GitHub's ids grow
                      with creation, so a suspend and the resume written after it apply in
                      that order when both are pending. LastToggle keeps that order for a
                      suspend or resume that arrives after a later one is answered.
                    items:
                      description: |-
                        FindingCommand is one human command made on the tracking issue, as it
                        moves from recorded (by the delivery) to decided, applied and answered
                        (by the projection). Each step is one durable write, so a retry after any
                        failure resumes where the last one stopped: a decision is never taken
                        twice, the spec is never written twice, and the reply is posted once.
                      properties:
                        actor:
                          description: Actor wrote the comment.
                          properties:
                            id:
                              description: ID is GitHub's numeric id of the account.
                              format: int64
                              minimum: 0
                              type: integer
                            login:
                              description: Login of the account.
                              maxLength: 64
                              minLength: 1
                              pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*(\[bot\])?$
                              type: string
                            type:
                              description: 'Type is GitHub''s account type: User,
                                Bot or Organization.'
                              maxLength: 32
                              type: string
                          required:
                          - login
                          type: object
                        answeringSince:
                          description: |-
                            AnsweringSince is when patchy first set out to answer the command
                            (the reaction and the reply), written before either. A pass after a
                            failure therefore knows a reply may already be posted, and looks for
                            it among the issue's comments since then rather than posting another;
                            and an answer GitHub keeps failing is given up an hour after it, the
                            command consumed without it.
                          format: date-time
                          type: string
                        applied:
                          description: Applied reports that a Done command's effect
                            is written to the spec.
                          type: boolean
                        available:
                          description: |-
                            Available are the verbs the finding's phase admitted when an
                            Unavailable outcome was decided, for the reply to list.
                          items:
                            maxLength: 32
                            type: string
                          maxItems: 8
                          type: array
                        commentID:
                          description: CommentID is GitHub's id of the comment carrying
                            the command.
                          format: int64
                          minimum: 1
                          type: integer
                        decidedAt:
                          description: |-
                            DecidedAt is when the outcome was decided, and the time a Done
                            command's effect is recorded with on the spec.
                          format: date-time
                          type: string
                        legacy:
                          description: |-
                            Legacy marks a command made with the deprecated approve comment
                            ("/approve", or the Integration's approveComment) rather than
                            "/patchy approve".
                          type: boolean
                        note:
                          description: Note is the text after the verb; approve records
                            it on the approval.
                          maxLength: 1024
                          type: string
                        outcome:
                          description: Outcome is the answer decided; empty until
                            it is.
                          enum:
                          - Done
                          - Unavailable
                          - NotAllowed
                          - UnknownVerb
                          - Superseded
                          type: string
                        quiet:
                          description: |-
                            Quiet marks a refusal answered by the reaction alone: its author was
                            already sent a refusal on this finding (FindingCommands.RefusedActors).
                          type: boolean
                        receivedAt:
                          description: ReceivedAt is when the delivery carrying the
                            command was handled.
                          format: date-time
                          type: string
                        verb:
                          description: |-
                            Verb is the command's verb, lower-cased; empty when the command line
                            names no word patchy could read as one.
                          maxLength: 32
                          pattern: ^[a-z]*$
                          type: string
                      required:
                      - actor
                      - commentID
                      - receivedAt
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-list-map-keys:
                    - commentID
                    x-kubernetes-list-type: map
                  refusedActors:
                    description: |-
                      RefusedActors are the GitHub ids of the accounts already sent a reply
                      refusing a command on this finding (NotAllowed or UnknownVerb), the
                      latest MaxRefusedActors of them. A later refusal to one of them is
                      answered by the reaction alone (FindingCommand.Quiet), so an account
                      commenting repeatedly cannot make patchy post a reply per comment.
                    items:
                      format: int64
                      type: integer
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                type: object
              completedAt:
                description: |-
                  CompletedAt is set on terminal-phase entry and cleared on revival; the
                  TTL contract is completedAt + TTL.
                format: date-time
                type: string
              conditions:
                description: Conditions of the finding.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              enrichments:
                description: Enrichments are the enhancer contributions (context).
                items:
                  description: |-
                    Enrichment is one enhancer's contribution, written by context-controller
                    and projected as a tracking comment by integration-controller.
                  properties:
                    appliedAt:
                      description: AppliedAt is when the enrichment was recorded.
                      format: date-time
                      type: string
                    attributes:
                      additionalProperties:
                        type: string
                      description: |-
                        Attributes are the enhancer's semi-structured facts (system,
                        environment, tier), projected as tracking labels.
                      type: object
                    enhancer:
                      description: Enhancer is the enhancer ID.
                      type: string
                    markdown:
                      description: |-
                        Markdown is arbitrary enhancer content, projected as a sticky tracking
                        comment.
                      maxLength: 16384
                      type: string
                    owners:
                      description: |-
                        Owners are code-owner logins the enhancer identified, in preference
                        order.
                      items:
                        type: string
                      type: array
                  required:
                  - appliedAt
                  - enhancer
                  type: object
                maxItems: 8
                type: array
              firstObservedAt:
                description: FirstObservedAt is when the first alert arrived (integration).
                format: date-time
                type: string
              forge:
                description: Forge names the resolved Forge, for observability.
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              investigation:
                description: Investigation summarizes the latest Investigation child
                  (investigation).
                properties:
                  attempt:
                    description: Attempt ordinal.
                    format: int32
                    type: integer
                  awaitApproval:
                    description: AwaitApproval marks an approval hold; HoldReasons
                      says why.
                    type: boolean
                  completedAt:
                    description: CompletedAt is when the investigation finished.
                    format: date-time
                    type: string
                  confidence:
                    description: Confidence decimal string in [0, 1].
                    pattern: ^(0(\.[0-9]{1,4})?|1(\.0{1,4})?)$
                    type: string
                  estimate:
                    description: |-
                      Estimate the investigation made for the remediation, mirrored here so
                      the approving human can see what they are authorizing.
                    properties:
                      maxTurns:
                        description: MaxTurns the investigation predicts the remediation
                          will take.
                        format: int32
                        minimum: 0
                        type: integer
                      tokenBudget:
                        description: TokenBudget is the predicted output-token spend.
                        format: int64
                        minimum: 0
                        type: integer
                    type: object
                  exploitability:
                    description: Exploitability rating.
                    enum:
                    - none
                    - low
                    - medium
                    - high
                    - critical
                    type: string
                  holdReasons:
                    description: HoldReasons enumerates every reason the hold fired.
                    items:
                      description: |-
                        HoldReason names why a finding stopped in AwaitingApproval instead of
                        going straight to Queued. A hold can have several reasons at once, so they
                        are reported as a set rather than folded into one flag.
                      enum:
                      - breakingChangeAvailable
                      - lowConfidence
                      - exceedsAutomatedTurns
                      - exceedsAutomatedTokens
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  impact:
                    description: Impact rating.
                    enum:
                    - none
                    - low
                    - medium
                    - high
                    - critical
                    type: string
                  likelihood:
                    description: Likelihood rating.
                    enum:
                    - none
                    - low
                    - medium
                    - high
                    - critical
                    type: string
                  name:
                    description: Name of the Investigation child.
                    type: string
                  outcome:
                    description: Outcome of the stage (envelope vocabulary).
                    type: string
                  recommendation:
                    description: Recommendation verdict.
                    enum:
                    - remediate
                    - ignore
                    - manual
                    type: string
                  runnerImage:
                    description: |-
                      RunnerImage the investigation ran on, mirrored from the child for the
                      projection (the tracking issue's sticky comment and the status page).
                    properties:
                      image:
                        description: |-
                          Image is the image reference the agent container ran, as written into
                          the Job. With Source "repository" it is the digest-pinned reference
                          resolved onto the Repository's status. With Source "default" it is the
                          per-harness runner image exactly as the operator configured it, which
                          is digest-pinned only if that configuration pins it (a tag otherwise).
                        type: string
                      manifest:
                        description: |-
                          Manifest is the declaring file's repository-relative path, copied from
                          the Repository at launch when Source is "repository" so the tracking
                          issue and describe can name the file; empty otherwise.
                        type: string
                      source:
                        description: |-
                          Source is RunnerImageSourceRepository when the image came from the
                          Repository's declaration and RunnerImageSourceDefault when the
                          per-harness runner image ran (nothing declared, a non-claude harness,
                          the kill switch).
                        enum:
                        - repository
                        - default
                        type: string
                    required:
                    - image
                    - source
                    type: object
                required:
                - attempt
                - name
                type: object
              lastFailureReason:
                description: LastFailureReason explains the most recent failed edge.
                maxLength: 4096
                type: string
              observedGeneration:
                description: ObservedGeneration is the last spec generation acted
                  on.
                format: int64
                type: integer
              owners:
                description: Owners are the humans responsible for the finding (context).
                items:
                  type: string
                type: array
              phase:
                description: Phase of the lifecycle (see transitions.go for edges
                  and writers).
                enum:
                - Opened
                - Enhanced
                - Investigating
                - Queued
                - AwaitingApproval
                - Remediating
                - InReview
                - Remediated
                - Failed
                - Dismissed
                - HandedOff
                type: string
              phaseTimes:
                description: PhaseTimes is the append-only phase entry log.
                items:
                  description: PhaseTime records when the finding entered a phase
                    (append-only).
                  properties:
                    at:
                      description: At is the entry time.
                      format: date-time
                      type: string
                    phase:
                      description: Phase entered.
                      enum:
                      - Opened
                      - Enhanced
                      - Investigating
                      - Queued
                      - AwaitingApproval
                      - Remediating
                      - InReview
                      - Remediated
                      - Failed
                      - Dismissed
                      - HandedOff
                      type: string
                  required:
                  - at
                  - phase
                  type: object
                type: array
              priority:
                description: |-
                  Priority is the scheduling priority derived from investigation results
                  (investigation) — the remediation queue's sort dimension.
                enum:
                - low
                - medium
                - high
                - critical
                type: string
              pullRequest:
                description: |-
                  PullRequest is the remediation PR (remediation opens; integration owns
                  state/mergedAt/mergeCommitSHA).
                properties:
                  mergeCommitSHA:
                    description: |-
                      MergeCommitSHA is the commit the merge put on the base branch (the
                      merge, squash, or last rebased commit): the first revision carrying
