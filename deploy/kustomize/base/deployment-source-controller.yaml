---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: patchy-source-controller
    namespace: patchy
    labels:
        app: source-controller
        app.kubernetes.io/name: source-controller
        app.kubernetes.io/part-of: patchy
        app.kubernetes.io/component: controller
spec:
    # One replica + Recreate: the artifact store is local state (the emptyDir
    # below), so two replicas would serve two disjoint artifact sets. Leader
    # election is additional insurance during rollouts.
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app.kubernetes.io/name: source-controller
            app.kubernetes.io/part-of: patchy
    template:
        metadata:
            labels:
                app: source-controller
                app.kubernetes.io/name: source-controller
                app.kubernetes.io/part-of: patchy
                app.kubernetes.io/component: controller
        spec:
            serviceAccountName: patchy-source-controller
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                fsGroup: 65532
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: controller
                  # Built from Dockerfile.controller (repo root)
                  # (TARGET=source-controller in .goreleaser.yaml).
                  image: ghcr.io/devthenet-labs/patchy/source-controller:latest
                  args: ["serve"]
                  envFrom:
                      - configMapRef:
                            name: patchy-config
                  env:
                      - name: POD_NAMESPACE
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.namespace
                  ports:
                      - name: artifact
                        containerPort: 9790
                        protocol: TCP
                      - name: internal
                        containerPort: 9791
                        protocol: TCP
                      - name: health
                        containerPort: 8081
                        protocol: TCP
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: health
                      initialDelaySeconds: 5
                      periodSeconds: 20
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: health
                      initialDelaySeconds: 2
                      periodSeconds: 10
                  resources:
                      requests:
                          cpu: 50m
                          memory: 96Mi
                      limits:
                          cpu: 500m
                          memory: 512Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                      seccompProfile:
                          type: RuntimeDefault
                  volumeMounts:
                      - name: data
                        mountPath: /data
                      - name: tmp
                        mountPath: /tmp
            volumes:
                # Artifact storage (PATCHY_ARTIFACT_DIR=/data/artifacts).
                # Artifacts are reproducible — a re-fetch at the pinned SHA
                # rebuilds them — so an emptyDir is acceptable; swap in a PVC
                # in your overlay if repository archives are large or the API
                # quota is tight.
                - name: data
                  emptyDir: {}
                # The root filesystem is read-only; Go's os.CreateTemp and the
                # HTTP stack want a writable /tmp.
                - name: tmp
                  emptyDir: {}
