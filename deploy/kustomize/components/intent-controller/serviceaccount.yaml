---
# A controller identity like the base's: it mounts its token, and what it may
# do is pinned verb by verb in rbac.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
    name: patchy-intent-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: intent-controller
        app.kubernetes.io/part-of: patchy
