# Turns the intents views on (--intents-enabled).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: patchy-status-server
    namespace: patchy
spec:
    template:
        spec:
            containers:
                - name: server
                  env:
                      - name: PATCHY_INTENTS_ENABLED
                        value: "true"
