#
# The stand-in sibling component's ClusterIP Service in slot 0, for run.sh's
# sibling run. run.sh creates it with `kubectl create` and never a
# client-side `kubectl apply`, which would add its last-applied annotation:
# the slot Service admission policy admits no annotation but a health-check
# path. charts/patchy/preview_probe_envtest_test.go runs run.sh's own
# command on this file against the rendered policies.
apiVersion: v1
kind: Service
metadata:
  name: preview-isolation-sibling
  namespace: patchy-preview-0
spec:
  type: ClusterIP
  selector: {app: preview-isolation-sibling}
  ports:
    - {name: http, port: 80, targetPort: 8080, protocol: TCP}
