        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: patchy
        app.kubernetes.io/part-of: patchy
data:
    PATCHY_AGENT_NAMESPACE: "patchy-agents"
    PATCHY_AUTH_CONFIG: "/etc/patchy/auth/config.yaml"
    PATCHY_HEALTH_ADDR: ":8081"
    PATCHY_INTENTS_ENABLED: "true"
    PATCHY_LISTEN_ADDR: ":8080"
    PATCHY_LOG_LEVEL: "warn"
