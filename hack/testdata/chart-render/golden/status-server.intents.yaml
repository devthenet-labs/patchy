---
# Source: patchy/templates/status-server.yaml
# Ingress: 8080 from anywhere (the fronting ingress/gateway lives wherever
# yours does; session authentication and the public-rollups-only unconfigured
# posture carry the access control) plus 8081 probes. Egress: DNS, the
# Kubernetes API server (cache watches + access reviews), and TCP 443 out
# (the OIDC issuer, an OTLP collector).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: patchy-status-server
    namespace: patchy
    labels:
        app: status-server
        helm.sh/chart: patchy-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: patchy
        app.kubernetes.io/part-of: patchy
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: status-server
            app.kubernetes.io/instance: patchy
            app.kubernetes.io/part-of: patchy
    policyTypes: [Ingress, Egress]
    ingress:
        - ports:
              - protocol: TCP
                port: 8080
              - protocol: TCP
                port: 8081
    egress:
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
        - ports:
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 6443
---
# Source: patchy/templates/status-server.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
    name: patchy-status-server
    namespace: patchy
    labels:
