# Source: patchy/templates/status-server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
    name: patchy-status-server
    namespace: patchy
    labels:
        app: status-server
        helm.sh/chart: patchy-VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "VERSION"
        app.kubernetes.io/name: status-server
        app.kubernetes.io/instance: patchy
        app.kubernetes.io/part-of: patchy
        app.kubernetes.io/component: server
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app.kubernetes.io/name: status-server
            app.kubernetes.io/instance: patchy
            app.kubernetes.io/part-of: patchy
    template:
        metadata:
            labels:
                app: status-server
                helm.sh/chart: patchy-VERSION
                app.kubernetes.io/managed-by: Helm
                app.kubernetes.io/version: "VERSION"
                app.kubernetes.io/name: status-server
                app.kubernetes.io/instance: patchy
                app.kubernetes.io/part-of: patchy
                app.kubernetes.io/component: server
            annotations:
                checksum/config: 2e641c22393573217e1196e4d5f99ab753ee9a9c60e7bb996554609f3eb55414
        spec:
            serviceAccountName: patchy-status-server
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                fsGroup: 65532
                fsGroupChangePolicy: Always
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: server
                  image: ghcr.io/devthenet-labs/patchy/status-server:vVERSION
                  imagePullPolicy: IfNotPresent
                  args: ["serve"]
                  envFrom:
                      - configMapRef:
                            name: patchy-status-server-config
                  env:
                      - name: POD_NAMESPACE
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.namespace
                  ports:
                      - name: http
                        containerPort: 8080
                        protocol: TCP
                      - name: health
                        containerPort: 8081
                        protocol: TCP
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: health
                      initialDelaySeconds: 5
                      periodSeconds: 20
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: health
                      initialDelaySeconds: 2
                      periodSeconds: 10
                  resources:
                      limits:
                        cpu: 500m
                        memory: 256Mi
                      requests:
                        cpu: 50m
                        memory: 64Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                      seccompProfile:
                          type: RuntimeDefault
                  volumeMounts:
                      - name: auth
                        mountPath: /etc/patchy/auth
                        readOnly: true
                      - name: tmp
                        mountPath: /tmp
            volumes:
                # optional: with no auth Secret at all the server runs the
                # rollups-only posture.
                - name: auth
                  secret:
                      secretName: patchy-status-auth
                      optional: true
                - name: tmp
                  emptyDir: {}
