#
# chart-render-test fixture: preview sign-in on in its permit stage (B1),
# rendered over preview-foundation.yaml (plus intent-controller.yaml and
# preview-controller.yaml for the require stage), with one viewer team and
# one viewer user. These renders have no cluster, so the chart-managed keys
# are throwaway (keys.renderOffline); chart-render-test checks the refusal
# without it.
previewAuth:
    enabled: true
    keys:
        renderOffline: true
    host: preview-auth.patchy.devthe.net
    dex:
        issuerURL: https://dex.patchy.devthe.net
        clientID: patchy-preview-auth
        existingSecret: patchy-preview-auth-dex
    viewers:
        teams:
            - devthenet-labs:reviewers
        users:
            - octocat
