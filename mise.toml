#
# patchy consumes the shared toolchain (bitwise-media-group/toolchain) as the
# .mise/ submodule: pinned tools + the go-cli task archetype come from there,
# and the Makefile is a thin forwarder (.mise/mise.mk). Structural knobs live
# in [vars]; repo-local tasks live in tasks.toml (see [task_config] below).

[settings]
lockfile = true
locked = true
minimum_release_age = "7d"

[vars]
# patchy is multi-binary (six entrypoints under cmd/), so tasks.toml redefines
# the archetype's `build` with a loop; app/app_pkg exist only so the archetype's
# single-app go-build task stays renderable.
app = "patchy"
app_pkg = "./cmd/source-controller"

[task_config]
# Repo-local tasks live in tasks.toml, included AFTER the archetype so its
# same-named task (build) replaces the archetype's definition — an included
# file wins over this config's own [tasks] on name collisions.
includes = [".mise/tasks/go-cli.toml", "tasks.toml"]

# Repo-local tool pins the shared toolchain doesn't carry: the Kubernetes
# code/CRD generator and the envtest binary manager for api/v1alpha1.
# controller-gen floats on its own release line; setup-envtest tracks the
# controller-runtime minor pinned in go.mod (v0.24.x). yq extracts the CRD
# spec schemas into the patchy-config values schema (hack/codegen.sh).
[tools]
# Overrides the shared toolchain's go, which locks 1.26.6: go.mod asks for
# 1.26.9, the release that fixes GO-2026-6599 to GO-2026-6617 (net/http,
# HTTP/2, crypto/tls, html/template), and the tasks run with
# GOTOOLCHAIN=local. Toolchain v3 moved the go pin into each repo's root, so
# this pin stays when the submodule moves to v3.
go = "1.26.9"
# osv-scanner is a runtime dependency of `patchy mirror` image scanning
# (the scan stage shells out to it); cosign — which sign/verify shell out
# to — is already pinned by the shared toolchain.
"aqua:google/osv-scanner" = "2.5.1"
"go:sigs.k8s.io/controller-tools/cmd/controller-gen" = "v0.22.0"
"go:sigs.k8s.io/controller-runtime/tools/setup-envtest" = "v0.25.0"
"go:golang.org/x/perf/cmd/benchstat" = "0.0.0-20260709024250-82a0b07e230d"
"aqua:mikefarah/yq" = "4.53.6"
# Overrides the shared toolchain's kubescape (lint-kustomize's scanner), which
# locks v4.0.11. kubescape downloads its controls bundle at scan time, and that
# bundle now carries CEL-language rules (C-0207, C-0262, C-0275, C-0276,
# C-0292, C-0295, C-0296). v4.0.9-v4.0.12 cannot evaluate CEL rules — a stub
# until kubescape/kubescape#3513 (issue #3512) — so every scan dies with
# `no ValidatingAdmissionPolicy for control ... in embedded bundle`, whatever
# the manifests hold. v4.0.13 wires CEL in but races (`concurrent map
# iteration and map write`, fixed by #3787), so v4.0.14 is the first release
# that scans. Drop this pin once the toolchain's mise.lock reaches >= v4.0.14.
"aqua:kubescape/kubescape" = "4.0.14"
